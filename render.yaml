databases:
  - name: arshab-db
    databaseName: arshab
    user: arshab
    plan: free

services:
  # Backend API (FastAPI)
  - type: web
    name: arshab-api-arun110908
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Creates tables + loads curriculum (idempotent), then starts the API.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: arshab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://arshab-arun110908.onrender.com

  # Frontend (React static site)
  - type: web
    name: arshab-arun110908
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Proxy API calls through the same origin: no CORS or cross-site cookie problems.
      - type: rewrite
        source: /api/*
        destination: https://arshab-api-arun110908.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
